[project]
name = "model_lens"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0,<4.10.0",
    "ultralytics==8.4.33",
    "uvicorn==0.42.0",
    "fastapi==0.128.8",
    "numpy==1.26.4",
]

[dependency-groups]
dev = [
    "types-dataclasses==0.6.6",
    "types-requests==2.31.0.2",
    "types-setuptools==68.2.0.0",
    "setuptools==78.1.1",
    "mypy==1.6.1",
    "ruff==0.1.4",
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "pytest-mock>=3.14.1",
]

[build-system]                                                                                                                                                                  
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
                                                                                                                                        
[tool.setuptools.packages.find]
where = ["src"]                                                                                                                                                 
                                                                                                                                                                                
[tool.setuptools.package-data]
model_lens = ["dist/**/*"]

[tool.pytest.ini_options]
minversion = "6.2"
addopts = "-qq"
log_cli = "true"
log_cli_level = "INFO"
testpaths = [
    "tests",
]

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["D", "E", "F", "W", "B", "ISC", "C4", "UP"]
fixable = ["D", "E", "F", "W", "B", "ISC", "C4", "UP"]
ignore = ["B024", "B027"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "proto",
]

[tool.ruff.pydocstyle]
convention = "google"
